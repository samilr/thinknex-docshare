name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: thinknex
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: share_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U thinknex" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://thinknex:ci-only-password@localhost:5432/share_test
    strategy:
      matrix:
        service: [document-api, share-api]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
