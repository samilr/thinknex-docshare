name: deploy

# Despliegue a GCP con Workload Identity Federation (sin llaves JSON).
# Requiere variables del repositorio: GCP_PROJECT_ID, GCP_REGION, GCP_NAME_PREFIX,
# GCP_WIF_PROVIDER y GCP_DEPLOYER_SA (ver `terraform output`).
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION }}
      NAME_PREFIX: ${{ vars.GCP_NAME_PREFIX }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_NAME_PREFIX }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/setup-buildx-action@v3
      - run: ./scripts/deploy.sh
