<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Documento compartido</title>
<style nonce="{nonce}">
  :root { color-scheme: light dark; --accent: #2457d6; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 30rem; margin: 3rem auto; padding: 0 1rem; }
  .card { border: 1px solid #8884; border-radius: 12px; padding: 1.5rem; }
  h1 { font-size: 1.25rem; margin-top: 0; }
  .muted { opacity: .75; font-size: .9rem; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  input { font-size: 1.25rem; letter-spacing: .3em; width: 9ch; padding: .4rem; border-radius: 8px; border: 1px solid #8888; }
  .row { display: flex; gap: .5rem; align-items: center; margin: 1rem 0; }
  #msg { min-height: 1.5rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<main class="card">
  <h1>{shared_by} compartió un documento contigo</h1>
  <p class="muted">Por seguridad, verificaremos tu identidad con un código enviado a <strong>{destination}</strong> ({channel}). El enlace vence el {expires_at} UTC.</p>
  <div class="row"><button id="send">Enviar código</button></div>
  <div id="verify" class="row hidden">
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" aria-label="Código de 6 dígitos">
    <button id="go">Verificar y descargar</button>
  </div>
  <p id="msg" role="status"></p>
  <p class="muted">La descarga queda registrada e incluye una marca de agua con tu nombre.</p>
</main>
<script nonce="{nonce}">
  const base = location.pathname.replace(/\/$/, "");
  const msg = (t) => (document.getElementById("msg").textContent = t);
  async function post(path, body) {
    const r = await fetch(base + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || data.title || "Error");
    return data;
  }
  document.getElementById("send").onclick = async (e) => {
    e.target.disabled = true;
    try {
      const r = await post("/otp");
      msg("Código enviado a " + r.sent_to + ".");
      document.getElementById("verify").classList.remove("hidden");
      document.getElementById("code").focus();
    } catch (err) { msg(err.message); }
    setTimeout(() => (e.target.disabled = false), 30000);
  };
  document.getElementById("go").onclick = async () => {
    try {
      const { access_token } = await post("/verify", { code: document.getElementById("code").value });
      const r = await fetch(base + "/download", { headers: { Authorization: "Bearer " + access_token } });
      if (!r.ok) throw new Error("No fue posible descargar el documento");
      const name = (r.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/);
      const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await r.blob()), download: name ? name[1] : "documento.pdf" });
      a.click();
      msg("Descarga iniciada.");
    } catch (err) { msg(err.message); }
  };
</script>
</body>
</html>
