# Base común a los perfiles que corren en Docker (APP_ENV=local | hybrid).
# Se combina con compose.<perfil>.yml; ver `make up` y docs/07-entornos.md.
name: thinknex-share

services:
  # Bandeja SMTP de desarrollo: recibe los correos en local e hybrid (http://localhost:8025).
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]

  document-api:
    build: ./services/document-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      DMS_API_KEY: ${DMS_API_KEY:?definir en el archivo de entorno}
      DMS_AUTO_SEED: "true"
    ports: ["8001:8001"]

  share-api:
    build: ./services/share-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      JWT_SECRET: ${JWT_SECRET:?definir en el archivo de entorno}
      OTP_SECRET: ${OTP_SECRET:?definir en el archivo de entorno}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?definir en el archivo de entorno}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?definir en el archivo de entorno}
      DEMO_USERS_ENABLED: ${DEMO_USERS_ENABLED:-false}
      DEMO_USERS_PASSWORD: ${DEMO_USERS_PASSWORD:-}
      DMS_BASE_URL: http://document-api:8001
      DMS_API_KEY: ${DMS_API_KEY}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SIMULATED_INBOX_ENABLED: "true"
      FORWARDED_ALLOW_IPS: "*"
      SENSITIVITY_LLM_ENABLED: ${SENSITIVITY_LLM_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-fake}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-southamerica-east1}
    ports: ["8000:8000"]
    depends_on:
      mailpit: { condition: service_started }
      document-api: { condition: service_healthy }

  # Portal web: SPA + reverse proxy (mismo origen) hacia share-api.
  web:
    build:
      context: ./web
      args:
        VITE_SHOW_DEMO_ACCOUNTS: "true"
    environment:
      SHARE_API_URL: http://share-api:8000
      DNS_RESOLVER: 127.0.0.11
    ports: ["8080:8080"]
    depends_on:
      share-api: { condition: service_healthy }
